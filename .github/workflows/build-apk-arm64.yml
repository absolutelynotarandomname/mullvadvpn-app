---
name: Build APK (arm64, debug)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SDK_ROOT: ${{ github.workspace }}/.android-sdk
      NDK_DIR: ${{ github.workspace }}/.android-sdk/ndk/27.3.13750724

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                          /usr/local/share/boost /usr/share/swift \
                          /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK and NDK
        run: |
          # No pipefail on purpose: "yes | sdkmanager" kills "yes" with SIGPIPE
          # once sdkmanager finishes, and pipefail turns that into a false
          # failure. The official Dockerfile does the same without pipefail.
          set -eu
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sfLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/
          mv /tmp/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          # "platforms;android-37" does not exist; the minor version is part of the id.
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          curl -sfLo /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp/
          mv /tmp/android-ndk-r27d "$NDK_DIR"
          rm -rf "$NDK_DIR/sources" /tmp/ndk.zip /tmp/cmdline-tools.zip
          df -h /

      # Official rustup rather than a third-party action. The repo's
      # rust-toolchain.toml pins 1.97.1, which rustup honours automatically.
      - name: Install Rust
        run: |
          set -eu
          # Download to a file first: "curl | sh" can leave curl with SIGPIPE
          # once the installer is done reading, which pipefail would report
          # as a failure.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-linux-android

      - name: Export build environment
        run: |
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_TOOLCHAIN_DIR=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$NDK_TOOLCHAIN_DIR/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_TOOLCHAIN_DIR/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_TOOLCHAIN_DIR/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
          echo "RUST_ANDROID_GRADLE_PYTHON_COMMAND=/usr/bin/python3" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          # Pixel 6 is arm64-v8a, so build only that ABI instead of all four.
          ./android/gradlew -p android --no-daemon --console plain --stacktrace \
            -Pmullvad.app.build.cargo.targets=arm64 \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            :app:assembleOssProdDebug

      - name: Locate APK
        run: |
          set -euo pipefail
          apk=$(find android -name '*.apk' -path '*oss*' | head -1)
          test -n "$apk"
          echo "Found $apk"
          cp "$apk" "$RUNNER_TEMP/mullvad-pornblock-arm64.apk"
          ls -lh "$RUNNER_TEMP/mullvad-pornblock-arm64.apk"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mullvad-pornblock-apk
          path: ${{ runner.temp }}/mullvad-pornblock-arm64.apk
          if-no-files-found: error

      # A release asset is downloadable with plain curl and no GitHub login,
      # which is what makes this usable from a phone with no computer.
      - name: Publish as release
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="pornblock-${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP/mullvad-pornblock-arm64.apk" \
            --title "Mullvad with mandatory adult-content blocking" \
            --notes "arm64-v8a debug build, applicationId net.mullvad.mullvadvpn.pornblock" \
            || gh release upload "$tag" "$RUNNER_TEMP/mullvad-pornblock-arm64.apk" --clobber
          {
            echo "### Download from your phone (no login needed):"
            echo "curl -L -o mullvad.apk https://github.com/$REPO/releases/download/$tag/mullvad-pornblock-arm64.apk"
          } >> "$GITHUB_STEP_SUMMARY"
